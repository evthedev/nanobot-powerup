x-nanobot-volume: &nanobot-volume
  - /opt/nanobot:/root/.nanobot

services:

  # ── WhatsApp bridge (Baileys) ───────────────────────────────────────────────
  # Runs alongside gateway; Python connects via ws://nanobot-whatsapp-bridge:3002
  nanobot-whatsapp-bridge:
    container_name: nanobot-whatsapp-bridge
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/usr/bin/node"]
    command: ["/app/bridge/dist/index.js"]
    restart: unless-stopped
    volumes: *nanobot-volume
    environment:
      - BRIDGE_PORT=3002
      - BRIDGE_HOST=0.0.0.0
      - BRIDGE_TOKEN=${BRIDGE_TOKEN:-}
      - AUTH_DIR=/root/.nanobot/whatsapp-auth

  # ── nanobot gateway ─────────────────────────────────────────────────────────
  nanobot-gateway:
    container_name: nanobot-gateway
    build:
      context: .
      dockerfile: Dockerfile
    command: ["gateway"]
    restart: unless-stopped
    volumes: *nanobot-volume
    # Port 18791 (WebSocket) is internal only — dashboard talks to it directly
    expose:
      - "18791"
    environment:
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium
      - PLAYWRIGHT_BROWSERS_PATH=/usr/bin
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ── chat dashboard (Express API + React static) ───────────────────────────
  dashboard:
    container_name: nanobot-dashboard
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - /opt/nanobot:/root/.nanobot
      - /var/run/docker.sock:/var/run/docker.sock   # allows `docker restart` for gateway + WhatsApp bridge
    expose:
      - "3001"
    environment:
      - PORT=3001
      - NANOBOT_WS=ws://nanobot-gateway:18791
      - NANOBOT_HOME=/root/.nanobot
      - DB_PATH=/root/.nanobot/chat.db
      - DOCKER_API_VERSION=1.43   # Match host daemon so docker CLI can restart containers
    depends_on:
      - nanobot-gateway

  # ── nginx reverse proxy (HTTPS + basic auth) ─────────────────────────────
  nginx:
    container_name: nanobot-nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./deploy/nginx/entrypoint.sh:/entrypoint.sh:ro
      - nginx-ssl:/etc/nginx/ssl
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - dashboard

  # ── one-off CLI (docker compose --profile cli run nanobot-cli <cmd>) ──────
  nanobot-cli:
    profiles: ["cli"]
    build:
      context: .
      dockerfile: Dockerfile
    volumes: *nanobot-volume
    command: ["status"]
    stdin_open: true
    tty: true

volumes:
  nginx-ssl:
    driver: local
