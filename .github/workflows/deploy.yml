name: Provision & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  provision-and-deploy:
    name: Terraform + SSH deploy (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        environment: [clyde, shantelle]
    environment: ${{ matrix.environment }}

    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    ${{ vars.AWS_REGION }}
      # Terraform reads TF_VAR_* automatically as input variables
      TF_VAR_aws_region:     ${{ vars.AWS_REGION }}
      TF_VAR_key_pair_name:  ${{ secrets.EC2_KEY_PAIR_NAME }}
      TF_VAR_project_name:   ${{ vars.PROJECT_NAME }}

    steps:
      - uses: actions/checkout@v4

      # ── 1. Terraform: provision / update infra ──────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"
          terraform_wrapper: false  # wrapper interferes with output parsing

      - name: Debug credentials
        run: |
          echo "KEY_ID=${AWS_ACCESS_KEY_ID:0:8}..."
          echo "SECRET_LEN=${#AWS_SECRET_ACCESS_KEY}"

      - name: Terraform init
        working-directory: deploy/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="key=${{ vars.PROJECT_NAME || 'nanobot' }}/terraform.tfstate"

      - name: Terraform apply
        working-directory: deploy/terraform
        run: terraform apply -auto-approve

      - name: Get EC2 host from Terraform output
        id: tf
        working-directory: deploy/terraform
        run: echo "ec2_host=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"

      # ── 2. SSH: idempotent setup + deploy (works on fresh or existing instance) ─
      - name: Deploy to EC2
        env:
          EC2_HOST:                 ${{ steps.tf.outputs.ec2_host }}
          OPENROUTER_API_KEY:       ${{ secrets.OPENROUTER_API_KEY }}
          BRAVE_API_KEY:            ${{ secrets.BRAVE_API_KEY }}
          TAVILY_API_KEY:           ${{ secrets.TAVILY_API_KEY }}
          GOOGLE_CLIENT_ID:         ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:     ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_STATIC_MAPS_API_KEY: ${{ secrets.GOOGLE_STATIC_MAPS_API_KEY }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BRIDGE_TOKEN:             ${{ secrets.BRIDGE_TOKEN }}
          WHATSAPP_ALLOW_FROM:      ${{ secrets.WHATSAPP_ALLOW_FROM }}
          CAPSOLVER_API_KEY:        ${{ secrets.CAPSOLVER_API_KEY }}
          GMAIL_EMAIL:              ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD:       ${{ secrets.GMAIL_APP_PASSWORD }}
          GH_PAT:                   ${{ secrets.GH_PAT }}
          GH_REPO:                  ${{ vars.GH_REPO }}
        run: |
          printf '%s' "${{ secrets.EC2_SSH_KEY }}" > /tmp/ec2.pem
          chmod 600 /tmp/ec2.pem
          SSH="ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i /tmp/ec2.pem ubuntu@$EC2_HOST"
          SCP="scp -o StrictHostKeyChecking=no -i /tmp/ec2.pem"

          # Wait for SSH (instance may still be booting)
          echo "Waiting for SSH..."
          for i in $(seq 1 30); do
            $SSH true 2>/dev/null && { echo "  SSH ready"; break; }
            echo "  attempt $i/30 — retrying in 20s"; sleep 20
          done

          # Wait for Docker daemon (user_data installs it; may still be running)
          echo "Waiting for Docker..."
          for i in $(seq 1 30); do
            $SSH 'sudo docker info &>/dev/null' 2>/dev/null && { echo "  Docker ready"; break; }
            echo "  attempt $i/30 — retrying in 20s"; sleep 20
          done

          # Write secrets to JSON + scp to EC2 (no shell quoting — handles any special chars)
          python3 deploy/write_secrets.py
          $SCP /tmp/nanobot_secrets.json ubuntu@$EC2_HOST:/tmp/nanobot_secrets.json
          rm -f /tmp/nanobot_secrets.json

          # ── Phase 1: repo + first-time setup + inject API keys + docker group ───
          $SSH bash << 'SETUP'
            set -euo pipefail
            REPO_DIR="/opt/nanobot-app"
            REPO_URL="https://github.com/evthedev/nanobot-powerup.git"

            # Ensure correct repo (handle missing .git or wrong remote)
            CURRENT=$(git -C "$REPO_DIR" remote get-url origin 2>/dev/null || true)
            if [ "$CURRENT" != "$REPO_URL" ]; then
              echo "--- cloning repo (current: ${CURRENT:-none}) ---"
              sudo rm -rf "$REPO_DIR"
              sudo git clone "$REPO_URL" "$REPO_DIR"
              sudo chown -R ubuntu:ubuntu "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            echo "--- pulling latest ---"
            git fetch origin main
            git reset --hard origin/main

            # Ensure /opt/nanobot is writable by ubuntu (user_data runs as root)
            sudo chown -R ubuntu:ubuntu /opt/nanobot

            # ── Sync workspace files (SOUL.md, skills) from repo → /opt/nanobot/workspace ──
            echo "--- syncing workspace ---"
            WORKSPACE_SRC="$REPO_DIR/workspace"
            WORKSPACE_DST="/opt/nanobot/workspace"
            # Sync top-level workspace .md files
            # HEARTBEAT.md, USER.md are runtime state — never overwrite from repo
            for f in "$WORKSPACE_SRC"/*.md; do
              [ -f "$f" ] || continue
              bn=$(basename "$f")
              case "$bn" in HEARTBEAT.md|USER.md) continue ;; esac
              cp "$f" "$WORKSPACE_DST/" && echo "  synced $bn"
            done
            # Ensure memory/ dir exists but never overwrite its contents (agent-managed)
            mkdir -p "$WORKSPACE_DST/memory"
            # Sync base-layer skills from repo → instance.
            # NEVER touches skills-auto/ — that is the instance layer and belongs to the agent.
            for skill_dir in "$WORKSPACE_SRC"/skills/*/; do
              skill_name=$(basename "$skill_dir")
              mkdir -p "$WORKSPACE_DST/skills/$skill_name"
              rsync -a "$skill_dir" "$WORKSPACE_DST/skills/$skill_name/" 2>/dev/null || \
                cp -r "$skill_dir"* "$WORKSPACE_DST/skills/$skill_name/"
              echo "  synced skill: $skill_name"
            done
            # Remove skills deleted from repo (skills present on instance but not in git)
            for live_dir in "$WORKSPACE_DST/skills/"/*/; do
              skill_name=$(basename "$live_dir")
              if [ ! -d "$WORKSPACE_SRC/skills/$skill_name" ]; then
                rm -rf "$live_dir"
                echo "  removed deleted skill: $skill_name"
              fi
            done
            # Ensure instance layer directory exists so the agent can write to it immediately
            mkdir -p "$WORKSPACE_DST/skills-auto"

            # ── Inject API keys into config.json ──────────────────────────────────
            echo "--- injecting API keys ---"
            python3 "$REPO_DIR/deploy/inject_keys.py" --secrets /tmp/nanobot_secrets.json
            # Write .env.docker for WhatsApp bridge (BRIDGE_TOKEN)
            python3 "$REPO_DIR/deploy/write_docker_env.py"
            rm -f /tmp/nanobot_secrets.json

            # ── Migrate DB: replace any old hardcoded localhost URLs ───────────────
            echo "--- migrating DB ---"
            DB_PATH=/opt/nanobot/chat.db python3 "$REPO_DIR/deploy/migrate_db.py"

            # ── Write .env for Google OAuth (read from config.json — already injected) ──
            echo "--- writing .env ---"
            python3 "$REPO_DIR/deploy/write_dotenv.py"

            # Ensure ubuntu is in docker group (idempotent)
            sudo usermod -aG docker ubuntu
          SETUP

          # ── Phase 2: docker ops in a fresh SSH session (group membership now active) ─
          $SSH bash << 'DEPLOY'
            set -euo pipefail
            cd /opt/nanobot-app
            # Remove local dev override so it never pollutes the EC2 environment
            rm -f docker-compose.override.yml

            # Free disk before build: stop containers so old images become unused, then prune.
            # Patchright/Chromium layer extraction needs substantial space; 20GB root can fill during build.
            echo "--- disk before cleanup ---"
            df -h /
            echo "--- stopping containers (releases image refs so prune can remove them) ---"
            docker compose -f docker-compose.yml down --remove-orphans --timeout 30
            for i in $(seq 1 10); do
              REMAINING=$(docker ps -aq --filter "name=nanobot" | wc -l)
              [ "$REMAINING" -eq 0 ] && break
              echo "  waiting for $REMAINING container(s) to finish removal ($i/10)..."
              sleep 3
            done
            echo "--- pruning unused images and build cache to free disk ---"
            docker image prune -af
            docker builder prune -af
            echo "--- disk after cleanup ---"
            df -h /

            echo "--- building ---"
            docker compose -f docker-compose.yml build --pull

            echo "--- starting fresh ---"
            docker compose -f docker-compose.yml --env-file .env.docker up -d
            docker image prune -f
            echo "--- stack status ---"
            docker compose -f docker-compose.yml ps
          DEPLOY

          rm -f /tmp/ec2.pem
