name: Provision & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  provision-and-deploy:
    name: Terraform + SSH deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    ${{ vars.AWS_REGION }}
      # Terraform reads TF_VAR_* automatically as input variables
      TF_VAR_aws_region:     ${{ vars.AWS_REGION }}
      TF_VAR_key_pair_name:  ${{ secrets.EC2_KEY_PAIR_NAME }}

    steps:
      - uses: actions/checkout@v4

      # ── 1. Terraform: provision / update infra ──────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"
          terraform_wrapper: false  # wrapper interferes with output parsing

      - name: Terraform init
        working-directory: deploy/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform apply
        working-directory: deploy/terraform
        run: terraform apply -auto-approve

      - name: Get EC2 host from Terraform output
        id: tf
        working-directory: deploy/terraform
        run: echo "ec2_host=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"

      # ── 2. SSH: pull latest code and restart stack ──────────────────────────
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ steps.tf.outputs.ec2_host }}
        run: |
          # Write the SSH key to a temp file
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/ec2.pem
          chmod 600 /tmp/ec2.pem

          ssh -o StrictHostKeyChecking=no -i /tmp/ec2.pem ubuntu@"$EC2_HOST" bash << 'ENDSSH'
            set -euo pipefail
            cd /opt/nanobot-app

            echo "--- pulling latest code ---"
            git fetch origin main
            git reset --hard origin/main

            echo "--- building & restarting ---"
            docker compose build --pull
            docker compose up -d --remove-orphans
            docker image prune -f

            echo "--- stack status ---"
            docker compose ps
          ENDSSH

          rm -f /tmp/ec2.pem
