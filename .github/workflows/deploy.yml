name: Provision & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  provision-and-deploy:
    name: Terraform + SSH deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    ${{ vars.AWS_REGION }}
      # Terraform reads TF_VAR_* automatically as input variables
      TF_VAR_aws_region:     ${{ vars.AWS_REGION }}
      TF_VAR_key_pair_name:  ${{ secrets.EC2_KEY_PAIR_NAME }}
      # App secrets — injected into /opt/nanobot/config.json during deploy
      OPENROUTER_API_KEY:    ${{ secrets.OPENROUTER_API_KEY }}
      BRAVE_API_KEY:         ${{ secrets.BRAVE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      # ── 1. Terraform: provision / update infra ──────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"
          terraform_wrapper: false  # wrapper interferes with output parsing

      - name: Terraform init
        working-directory: deploy/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform apply
        working-directory: deploy/terraform
        run: terraform apply -auto-approve

      - name: Get EC2 host from Terraform output
        id: tf
        working-directory: deploy/terraform
        run: echo "ec2_host=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"

      # ── 2. SSH: idempotent setup + deploy (works on fresh or existing instance) ─
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ steps.tf.outputs.ec2_host }}
        run: |
          printf '%s' "${{ secrets.EC2_SSH_KEY }}" > /tmp/ec2.pem
          chmod 600 /tmp/ec2.pem
          SSH="ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i /tmp/ec2.pem ubuntu@$EC2_HOST"

          # Wait for SSH (instance may still be booting)
          echo "Waiting for SSH..."
          for i in $(seq 1 30); do
            $SSH true 2>/dev/null && { echo "  SSH ready"; break; }
            echo "  attempt $i/30 — retrying in 20s"; sleep 20
          done

          # Wait for Docker daemon (user_data installs it; may still be running)
          # Use sudo for this check only — ubuntu isn't in docker group until setup runs
          echo "Waiting for Docker..."
          for i in $(seq 1 30); do
            $SSH 'sudo docker info &>/dev/null' 2>/dev/null && { echo "  Docker ready"; break; }
            echo "  attempt $i/30 — retrying in 20s"; sleep 20
          done

          # ── Phase 1: repo + first-time setup + add ubuntu to docker group ──────
          $SSH bash << 'SETUP'
            set -euo pipefail
            REPO_DIR="/opt/nanobot-app"
            REPO_URL="https://github.com/evthedev/nanobot-powerup.git"

            # Ensure correct repo (handle missing .git or wrong remote)
            CURRENT=$(git -C "$REPO_DIR" remote get-url origin 2>/dev/null || true)
            if [ "$CURRENT" != "$REPO_URL" ]; then
              echo "--- cloning repo (current: ${CURRENT:-none}) ---"
              sudo rm -rf "$REPO_DIR"
              sudo git clone "$REPO_URL" "$REPO_DIR"
              sudo chown -R ubuntu:ubuntu "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            echo "--- pulling latest ---"
            git fetch origin main
            git reset --hard origin/main

            # First-time initialisation (creates /opt/nanobot/config.json, adds ubuntu to docker group)
            if [ ! -f "/opt/nanobot/config.json" ]; then
              echo "--- running first-time setup ---"
              sudo bash deploy/ec2-setup.sh
            fi

            # Ensure ubuntu is in docker group (idempotent)
            sudo usermod -aG docker ubuntu
          SETUP

          # ── Phase 1.5: inject API keys into config.json (base64 avoids shell injection) ─
          # Only patches keys that are set — leaves everything else untouched
          OR_B64=$(printf '%s' "$OPENROUTER_API_KEY" | base64 -w0)
          BR_B64=$(printf '%s' "$BRAVE_API_KEY"       | base64 -w0)
          $SSH python3 - "$OR_B64" "$BR_B64" << 'INJECT'
import sys, json, base64, pathlib
cfg_path = pathlib.Path('/opt/nanobot/config.json')
cfg = json.loads(cfg_path.read_text())
or_key = base64.b64decode(sys.argv[1]).decode().strip()
br_key = base64.b64decode(sys.argv[2]).decode().strip()
if or_key:
    cfg.setdefault('providers', {}).setdefault('openrouter', {})['apiKey'] = or_key
if br_key:
    cfg.setdefault('tools', {}).setdefault('web', {}).setdefault('search', {})['apiKey'] = br_key
cfg_path.write_text(json.dumps(cfg, indent=2))
print(f"  config.json patched (openrouter={'set' if or_key else 'skipped'}, brave={'set' if br_key else 'skipped'})")
INJECT

          # ── Phase 2: docker ops in a fresh SSH session (group membership now active) ─
          $SSH bash << 'DEPLOY'
            set -euo pipefail
            cd /opt/nanobot-app
            echo "--- building & restarting ---"
            docker compose build --pull
            docker compose up -d --remove-orphans
            docker image prune -f
            echo "--- stack status ---"
            docker compose ps
          DEPLOY

          rm -f /tmp/ec2.pem
