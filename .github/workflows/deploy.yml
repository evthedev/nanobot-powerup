name: Provision & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  provision-and-deploy:
    name: Terraform + SSH deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    ${{ vars.AWS_REGION }}
      # Terraform reads TF_VAR_* automatically as input variables
      TF_VAR_aws_region:     ${{ vars.AWS_REGION }}
      TF_VAR_key_pair_name:  ${{ secrets.EC2_KEY_PAIR_NAME }}

    steps:
      - uses: actions/checkout@v4

      # ── 1. Terraform: provision / update infra ──────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"
          terraform_wrapper: false  # wrapper interferes with output parsing

      - name: Terraform init
        working-directory: deploy/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform apply
        working-directory: deploy/terraform
        run: terraform apply -auto-approve

      - name: Get EC2 host from Terraform output
        id: tf
        working-directory: deploy/terraform
        run: echo "ec2_host=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"

      # ── 2. SSH: idempotent setup + deploy (works on fresh or existing instance) ─
      - name: Deploy to EC2
        env:
          EC2_HOST:                 ${{ steps.tf.outputs.ec2_host }}
          OPENROUTER_API_KEY:       ${{ secrets.OPENROUTER_API_KEY }}
          BRAVE_API_KEY:            ${{ secrets.BRAVE_API_KEY }}
          TAVILY_API_KEY:           ${{ secrets.TAVILY_API_KEY }}
          GOOGLE_CLIENT_ID:         ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:     ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_STATIC_MAPS_API_KEY: ${{ secrets.GOOGLE_STATIC_MAPS_API_KEY }}
        run: |
          printf '%s' "${{ secrets.EC2_SSH_KEY }}" > /tmp/ec2.pem
          chmod 600 /tmp/ec2.pem
          SSH="ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i /tmp/ec2.pem ubuntu@$EC2_HOST"

          # Wait for SSH (instance may still be booting)
          echo "Waiting for SSH..."
          for i in $(seq 1 30); do
            $SSH true 2>/dev/null && { echo "  SSH ready"; break; }
            echo "  attempt $i/30 — retrying in 20s"; sleep 20
          done

          # Wait for Docker daemon (user_data installs it; may still be running)
          echo "Waiting for Docker..."
          for i in $(seq 1 30); do
            $SSH 'sudo docker info &>/dev/null' 2>/dev/null && { echo "  Docker ready"; break; }
            echo "  attempt $i/30 — retrying in 20s"; sleep 20
          done

          # ── Phase 1: repo + first-time setup + inject API keys + docker group ───
          $SSH env \
            OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
            BRAVE_API_KEY="$BRAVE_API_KEY" \
            TAVILY_API_KEY="$TAVILY_API_KEY" \
            GOOGLE_STATIC_MAPS_API_KEY="$GOOGLE_STATIC_MAPS_API_KEY" \
            bash << 'SETUP'
            set -euo pipefail
            REPO_DIR="/opt/nanobot-app"
            REPO_URL="https://github.com/evthedev/nanobot-powerup.git"

            # Ensure correct repo (handle missing .git or wrong remote)
            CURRENT=$(git -C "$REPO_DIR" remote get-url origin 2>/dev/null || true)
            if [ "$CURRENT" != "$REPO_URL" ]; then
              echo "--- cloning repo (current: ${CURRENT:-none}) ---"
              sudo rm -rf "$REPO_DIR"
              sudo git clone "$REPO_URL" "$REPO_DIR"
              sudo chown -R ubuntu:ubuntu "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            echo "--- pulling latest ---"
            git fetch origin main
            git reset --hard origin/main

            # Ensure /opt/nanobot is writable by ubuntu (user_data runs as root)
            sudo chown -R ubuntu:ubuntu /opt/nanobot

            # ── Sync workspace files (SOUL.md, skills) from repo → /opt/nanobot/workspace ──
            echo "--- syncing workspace ---"
            WORKSPACE_SRC="$REPO_DIR/workspace"
            WORKSPACE_DST="/opt/nanobot/workspace"
            # Sync top-level workspace .md files
            for f in "$WORKSPACE_SRC"/*.md; do
              [ -f "$f" ] && cp "$f" "$WORKSPACE_DST/" && echo "  synced $(basename $f)"
            done
            # Sync skills (never delete existing skills — only add/update)
            for skill_dir in "$WORKSPACE_SRC"/skills/*/; do
              skill_name=$(basename "$skill_dir")
              mkdir -p "$WORKSPACE_DST/skills/$skill_name"
              rsync -a "$skill_dir" "$WORKSPACE_DST/skills/$skill_name/" 2>/dev/null || \
                cp -r "$skill_dir"* "$WORKSPACE_DST/skills/$skill_name/"
              echo "  synced skill: $skill_name"
            done

            # ── Inject API keys into config.json ──────────────────────────────────
            echo "--- injecting API keys ---"
            python3 "$REPO_DIR/deploy/inject_keys.py"

            # ── Write .env for Google OAuth (dashboard reads these at runtime) ────
            echo "--- writing .env ---"
            printf 'GOOGLE_CLIENT_ID=%s\nGOOGLE_CLIENT_SECRET=%s\nGOOGLE_STATIC_MAPS_API_KEY=%s\n' \
              "${GOOGLE_CLIENT_ID:-}" \
              "${GOOGLE_CLIENT_SECRET:-}" \
              "${GOOGLE_STATIC_MAPS_API_KEY:-}" \
              > "$REPO_DIR/.env"
            echo "  .env written"

            # Ensure ubuntu is in docker group (idempotent)
            sudo usermod -aG docker ubuntu
          SETUP

          # ── Phase 2: docker ops in a fresh SSH session (group membership now active) ─
          $SSH bash << 'DEPLOY'
            set -euo pipefail
            cd /opt/nanobot-app
            echo "--- building & restarting ---"
            docker compose build --pull
            docker compose up -d --remove-orphans
            docker image prune -f
            echo "--- stack status ---"
            docker compose ps
          DEPLOY

          rm -f /tmp/ec2.pem
