worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/json application/javascript text/xml application/xml;

  # Rate limiting — protect the login endpoint
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

  server {
    listen 80;
    server_name _;

    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    # Self-signed cert generated by entrypoint.sh on first run
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Basic Auth ────────────────────────────────────────────────────────────
    auth_basic           "nanobot";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Apply rate limit to auth failures (whole server behind auth anyway)
    limit_req zone=login burst=10 nodelay;

    # ── Google OAuth callback — must skip basic auth so Google redirect works ──
    location /api/google/auth/callback {
      auth_basic off;
      proxy_pass         http://dashboard:3001;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 30s;
    }

    # ── SSE: logs stream — must NOT be buffered ───────────────────────────────
    location /api/logs/stream {
      proxy_pass         http://dashboard:3001;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   Connection '';
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 24h;
      chunked_transfer_encoding on;
    }

    # ── SSE: message streaming — must NOT be buffered ─────────────────────────
    location ~ ^/api/conversations/.*/messages$ {
      proxy_pass         http://dashboard:3001;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   Connection '';
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 10m;
      chunked_transfer_encoding on;
    }

    # ── All other API and static routes ──────────────────────────────────────
    location / {
      proxy_pass         http://dashboard:3001;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_read_timeout 60s;
    }
  }
}
