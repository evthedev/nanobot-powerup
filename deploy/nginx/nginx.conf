worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/json application/javascript text/xml application/xml;

  # Rate limiting — protect the login endpoint
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

  client_max_body_size 50m;

  server {
    listen 80;
    server_name _;

    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
  }

  # Use Docker's embedded DNS so upstream hostnames re-resolve after container restarts
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 443 ssl;
    server_name _;

    # Self-signed cert generated by entrypoint.sh on first run
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Basic Auth ────────────────────────────────────────────────────────────
    auth_basic           "nanobot";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # ── Edge device messages — served by dashboard (reads activity_log) ───────────
    location ~ ^/api/devices/[^/]+/messages(/stream)?$ {
      proxy_pass         http://dashboard:3001;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   Connection '';
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 24h;
      chunked_transfer_encoding on;
    }

    # ── Edge device bridge — HMAC-signed, no basic auth ─────────────────────
    location ~ ^/api/devices/ {
      auth_basic off;
      proxy_pass         http://nanobot-whatsapp-bridge:18790;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_read_timeout 120s;
    }

    # ── Legacy Picoclaw/Reachy bridge path ────────────────────────────────────
    location ~ ^/picoclaw/api/ {
      auth_basic off;
      rewrite ^/picoclaw(/.*)$ $1 break;
      proxy_pass         http://nanobot-whatsapp-bridge:18790;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 30s;
    }

    # ── Screenshots — no auth, no rate limit (img tags load without credentials) ─
    location /api/screenshots/ {
      auth_basic off;
      proxy_pass http://dashboard:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # ── WhatsApp media (images from native app) — no auth (img tags in chat) ─
    location /api/wa-media/ {
      auth_basic off;
      proxy_pass http://dashboard:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # ── Google OAuth — no basic auth (popup window has no credentials context) ──
    # State param provides CSRF protection; no sensitive data is exposed here
    location /api/google/ {
      auth_basic off;
      proxy_pass          http://dashboard:3001;
      proxy_http_version  1.1;
      proxy_set_header    Host              $host;
      proxy_set_header    X-Real-IP         $remote_addr;
      proxy_set_header    X-Forwarded-Proto https;
    }

    # ── Chat message POST — rate-limited to prevent abuse ─────────────────────
    location ~ ^/api/conversations/.*/chat$ {
      limit_req zone=login burst=20 nodelay;
      proxy_pass         http://dashboard:3001;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── SSE: Telegram stream — must NOT be buffered ───────────────────────────
    location /api/telegram/stream {
      proxy_pass         http://dashboard:3001;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   Connection '';
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 24h;
      chunked_transfer_encoding on;
    }

    # ── SSE: logs stream — must NOT be buffered ───────────────────────────────
    location /api/logs/stream {
      proxy_pass         http://dashboard:3001;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   Connection '';
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 24h;
      chunked_transfer_encoding on;
    }

    # ── SSE: message streaming — must NOT be buffered ─────────────────────────
    location ~ ^/api/conversations/.*/messages$ {
      proxy_pass         http://dashboard:3001;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   Connection '';
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 10m;
      chunked_transfer_encoding on;
    }

    # ── Claude Code terminal ─────────────────────────────────────────────────
    location /ttyd {
      proxy_pass         http://claude-terminal:7681;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_read_timeout 24h;
    }

    # ── Edge device WebSocket — no basic auth, long timeout ──────────────────────
    location /edge/ws {
      auth_basic off;
      proxy_pass         http://nanobot-whatsapp-bridge:18790;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_read_timeout 3600s;
    }

    # ── All other API and static routes ──────────────────────────────────────
    location / {
      proxy_pass         http://dashboard:3001;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_read_timeout 60s;
    }
  }
}
